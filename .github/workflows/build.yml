name: Build and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: mallard-guard
          path: build/libs/*.jar
      - name: Upload to CurseForge
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CF_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: |
          if [ -z "$CF_API_TOKEN" ]; then
            echo 'CurseForge upload skipped: CURSEFORGE_API_TOKEN secret is not set.'
            exit 0
          fi
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          jar="build/libs/mallardguard-${mod_version}.jar"
          test -f "$jar"
          case "$mod_version" in
            *-alpha*) release_type=alpha ;;
            *-beta*)  release_type=beta ;;
            *-*)     echo "Unknown release type in mod_version=$mod_version" >&2; exit 1 ;;
            *)        release_type=release ;;
          esac
          changelog="$(git log -1 --pretty=%B)"
          metadata="$(CHANGELOG="$changelog" RELEASE_TYPE="$release_type" python3 -c 'import json, os; print(json.dumps({"changelog": os.environ["CHANGELOG"], "changelogType": "text", "gameVersionNames": ["1.21.1", "NeoForge", "Java 21", "Client", "Server"], "releaseType": os.environ["RELEASE_TYPE"]}))')"
          curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CF_API_TOKEN" \
            --form-string "metadata=$metadata" \
            -F "file=@$jar" \
            'https://minecraft.curseforge.com/api/projects/1712570/upload-file'
